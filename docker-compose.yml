version: "3"
services:
  jobmanager:
    image: flink:1.20.0-java11
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
    volumes:
      - ./output:/opt/flink/output
  taskmanager:
    image: flink:1.20.0-java11
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
    volumes:
      - ./output:/opt/flink/output
    deploy:
      replicas: 2
